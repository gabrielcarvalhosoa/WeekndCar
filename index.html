<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeekndCar | Clássicos para o seu fim de semana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-4">
    <section class="hero mb-4">
      <h1>Clássicos para o seu fim de semana</h1>
      <p class="lead">Reserve sábado e domingo ao volante de um ícone dos anos 60 e 70, em Belo Horizonte.</p>
    </section>
    <section id="destaques" class="mb-4" aria-label="Destaques"></section>
    <section aria-labelledby="titulo-catalogo">
      <h2 id="titulo-catalogo" class="h3">Catálogo</h2>
      <div id="filtros" class="d-flex flex-wrap gap-2 my-3" role="group" aria-label="Filtrar por categoria"></div>
      <p id="contagem" class="small" aria-live="polite"></p>
      <div id="grade" class="row g-4"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
  <script type="module" src="assets/js/controllers/catalogo-controller.js"></script>
</body>
</html>
