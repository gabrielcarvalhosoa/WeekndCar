<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <title>WeekndCar | Clássicos para o seu fim de semana</title>
  <link href="assets/css/theme.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-4">
    <h1>Clássicos para o seu fim de semana</h1>
    <p class="lead">Catálogo em construção.</p>
    <div id="catalogo" class="row g-4"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { api } from "./assets/js/api/api-client.js";
    import { renderNavbar } from "./assets/js/components/navbar.js";
    renderNavbar(document.getElementById("navbar"));
    try {
      const carros = await api.listar("carros");
      document.getElementById("catalogo").innerHTML = carros
        .map(c => `<div class="col-md-4"><div class="card h-100"><div class="card-body">
          <h5 class="card-title">${c.marca} ${c.modelo}</h5>
          <p class="card-text">${c.ano}, R$ ${c.diaria} por dia</p></div></div></div>`)
        .join("");
    } catch {
      document.getElementById("catalogo").textContent = "Não foi possível carregar o catálogo. Verifique se o comando npm run api está rodando.";
    }
  </script>
</body>
</html>
