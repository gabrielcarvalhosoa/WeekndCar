<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <title>Entrar | WeekndCar</title>
  <link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <form id="form-login" class="ficha p-4">
          <h1 class="h2 mb-1">Entrar</h1>
          <p class="mb-4">Acesse seus pedidos de aluguel.</p>
          <div id="msg" role="alert" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-wc w-100" type="submit">Entrar</button>
          <p class="mt-3 mb-0 text-center">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/controllers/login-controller.js"></script>
</body>
</html>
